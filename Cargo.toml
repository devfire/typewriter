[package]
name = "typewriter"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/devfire/typewriter"
license = "MIT"

# Binary crate: caret requirements let `cargo update` pick up
# semver-compatible fixes; the committed Cargo.lock guarantees
# reproducible builds, and CI runs with `--locked` so a stale
# lockfile fails instead of silently re-resolving.
[dependencies]
anyhow = "1.0.104"
eframe = "0.32.1"
hayro = "0.9.0"
lopdf = "0.36.0"
flate2 = "1.0"
weezl = "0.1"
rfd = "0.18.0"
sha2 = "0.10"
subsetter = { version = "0.2.6", default-features = false }
tempfile = "3"
ttf-parser = "0.25.1"

# The pedantic gate from AGENTS.md, enforced by the table (and by
# CI with `-D warnings`) instead of by prose alone.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
